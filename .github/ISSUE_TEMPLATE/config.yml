# Blank issues are disabled on purpose so public forms preserve their data-boundary warnings.
blank_issues_enabled: false
contact_links:
  - name: Neutral private contact request
    url: https://github.com/Chris0Jeky/developer-lens/issues/new?template=private_contact_request.md
    about: This request and your account are public; use it only if that visibility is safe.
  - name: Questions, ideas and general discussion
    url: https://github.com/Chris0Jeky/developer-lens/discussions
    about: Ask a question or float an idea with invented examples only; do not include private repository data.
  - name: Contributing guide and data boundary
    url: https://github.com/Chris0Jeky/developer-lens/blob/main/CONTRIBUTING.md
    about: Read this before attaching reproduction data, screenshots, or logs.
