name: Apply issue 257 bidi diagnostic hardening

on:
  push:
    branches:
      - fix/issue257-bidi-marks-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue257-bidi-marks-20260917
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add the bidi-mark regression case
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/projectContextValidation.test.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "String.fromCharCode(10, 13, 27, 133, 0x2028, 0x2029, 0x202A, 0x202E, 0x2066, 0x2069, 92)",
                  "String.fromCharCode(10, 13, 27, 133, 0x061C, 0x200E, 0x200F, 0x2028, 0x2029, 0x202A, 0x202E, 0x2066, 0x2069, 92)",
              ),
              (
                  "docs/control\\\\u000A\\\\u000D\\\\u001B\\\\u0085\\\\u2028\\\\u2029\\\\u202A\\\\u202E\\\\u2066\\\\u2069\\\\\\\\segment.md",
                  "docs/control\\\\u000A\\\\u000D\\\\u001B\\\\u0085\\\\u061C\\\\u200E\\\\u200F\\\\u2028\\\\u2029\\\\u202A\\\\u202E\\\\u2066\\\\u2069\\\\\\\\segment.md",
              ),
              (
                  r"/[\u0000-\u001F\u007F-\u009F\u2028\u2029\u202A-\u202E\u2066-\u2069]/",
                  r"/[\u0000-\u001F\u007F-\u009F\u061C\u200E\u200F\u2028\u2029\u202A-\u202E\u2066-\u2069]/",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one test match for {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Prove the regression is red
        shell: bash
        run: |
          set +e
          npm test -- scripts/projectContextValidation.test.ts > /tmp/issue257-red.log 2>&1
          status=$?
          set -e
          cat /tmp/issue257-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the new bidi-mark regression case to fail before the fix"
            exit 1
          fi

      - name: Escape the remaining bidi marks
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/projectContextValidation.ts')
          text = path.read_text(encoding='utf-8')
          old = r"/[\\\u0000-\u001F\u007F-\u009F\u2028\u2029\u202A-\u202E\u2066-\u2069]/g"
          new = r"/[\\\u0000-\u001F\u007F-\u009F\u061C\u200E\u200F\u2028\u2029\u202A-\u202E\u2066-\u2069]/g"
          if text.count(old) != 1:
              raise SystemExit(f'expected one diagnostic regex, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

      - name: Prove the focused and full gates
        run: |
          npm test -- scripts/projectContextValidation.test.ts
          npm run verify:context
          npm run check
          git diff --check

      - name: Assert bounded diff
        shell: python
        run: |
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'scripts/projectContextValidation.ts',
              'scripts/projectContextValidation.test.ts',
          }
          if changed != expected:
              raise SystemExit(f'unexpected changed files: {sorted(changed)}')

      - name: Commit the verified fix
        run: |
          git rm .github/workflows/agent-issue257-bidi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/projectContextValidation.ts scripts/projectContextValidation.test.ts
          git diff --cached --check
          git commit -m "fix: escape residual bidi diagnostic marks"
          git push origin HEAD:fix/issue257-bidi-marks-20260917
