name: Apply issue 320 model-promotion wording fix

on:
  push:
    branches:
      - fix/issue320-model-promotion-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue320-model-promotion-20260917
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add regression test
        shell: bash
        run: |
          cat > shared/researchFinding.modelPromotion.test.ts <<'EOF'
          import { readFile } from 'node:fs/promises'
          import { resolve } from 'node:path'
          import { describe, expect, it } from 'vitest'
          import {
            ResearchFindingSchema,
            UNSUPPORTED_CLAIMS,
            computeResearchFindingBundleHash,
            type ResearchFinding,
          } from './researchFinding.js'

          const fixturePath = resolve('research-contracts', 'research-finding', 'v1', 'wbc1.fixture.json')
          const outcomeNeutralDisclaimer = 'This trial does not promote a model.'

          describe('ResearchFinding model-promotion disclaimer', () => {
            it('stays outcome-neutral for every admissible decision outcome', async () => {
              const fixture = JSON.parse(await readFile(fixturePath, 'utf8')) as ResearchFinding
              expect(UNSUPPORTED_CLAIMS.model_promotion).toBe(outcomeNeutralDisclaimer)
              expect(fixture.unsupported_claims.find(({ code }) => code === 'model_promotion')).toEqual({
                code: 'model_promotion',
                display_text: outcomeNeutralDisclaimer,
              })

              for (const outcome of ['reject', 'revise_once', 'benchmarked'] as const) {
                const finding = structuredClone(fixture)
                finding.decision.outcome = outcome
                finding.decision.retained_fallback = outcome === 'reject'
                  ? finding.methods.baseline.method_code
                  : null
                finding.provenance.bundle_hash = computeResearchFindingBundleHash(finding)

                const parsed = ResearchFindingSchema.parse(finding)
                expect(parsed.unsupported_claims.find(({ code }) => code === 'model_promotion')).toEqual({
                  code: 'model_promotion',
                  display_text: outcomeNeutralDisclaimer,
                })
              }
            })
          })
          EOF

      - name: Prove the regression test is red
        shell: bash
        run: |
          set +e
          npm test -- shared/researchFinding.modelPromotion.test.ts > /tmp/issue320-red.log 2>&1
          status=$?
          set -e
          cat /tmp/issue320-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the pre-fix regression test to fail"
            exit 1
          fi

      - name: Make the disclaimer outcome-neutral
        shell: python
        run: |
          from pathlib import Path

          path = Path('shared/researchFinding.ts')
          text = path.read_text(encoding='utf-8')
          old = "model_promotion: 'This rejected trial cannot promote a model.',"
          new = "model_promotion: 'This trial does not promote a model.',"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one registry literal, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

      - name: Regenerate the published contract
        run: npm run generate:research-finding

      - name: Reconcile README registry and published hashes
        shell: python
        run: |
          from hashlib import sha256
          import json
          from pathlib import Path
          import re

          root = Path('research-contracts/research-finding/v1')
          fixture_path = root / 'wbc1.fixture.json'
          readme_path = root / 'README.md'
          fixture_bytes = fixture_path.read_bytes()
          fixture = json.loads(fixture_bytes.decode('utf-8'))
          readme = readme_path.read_text(encoding='utf-8')

          old_row = '| `model_promotion` | This rejected trial cannot promote a model. |'
          new_row = '| `model_promotion` | This trial does not promote a model. |'
          if readme.count(old_row) != 1:
              raise SystemExit(f'expected one README registry row, found {readme.count(old_row)}')
          readme = readme.replace(old_row, new_row)

          bundle_hash = fixture['provenance']['bundle_hash']
          readme, bundle_count = re.subn(
              r"(The fixture's\nbundle hash is `)sha256:[0-9a-f]{64}(`\.)",
              rf'\g<1>{bundle_hash}\g<2>',
              readme,
          )
          if bundle_count != 1:
              raise SystemExit(f'expected one README bundle hash, found {bundle_count}')

          file_hash = 'sha256:' + sha256(fixture_bytes).hexdigest()
          readme, file_count = re.subn(
              r'(The complete fixture file SHA-256 \(including its trailing\nnewline\) is:\n\n`)sha256:[0-9a-f]{64}(`)',
              rf'\g<1>{file_hash}\g<2>',
              readme,
          )
          if file_count != 1:
              raise SystemExit(f'expected one README file hash, found {file_count}')

          readme_path.write_text(readme, encoding='utf-8', newline='\n')

      - name: Prove the focused contract
        run: |
          npm test -- shared/researchFinding.modelPromotion.test.ts shared/researchFinding.test.ts
          npm run check:research-finding

      - name: Prove the repository and public surface
        run: |
          npm run check
          npm run build:showcase
          npm run verify:context
          git checkout -- public/social-card.png
          git diff --check

      - name: Assert bounded diff
        shell: python
        run: |
          import subprocess

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          actual = changed | untracked
          expected = {
              'shared/researchFinding.ts',
              'shared/researchFinding.modelPromotion.test.ts',
              'research-contracts/research-finding/v1/README.md',
              'research-contracts/research-finding/v1/schema.json',
              'research-contracts/research-finding/v1/wbc1.fixture.json',
          }
          if actual != expected:
              raise SystemExit(f'unexpected changed files: {sorted(actual)}')

      - name: Commit the verified fix
        run: |
          git rm .github/workflows/agent-issue320.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/researchFinding.ts shared/researchFinding.modelPromotion.test.ts research-contracts/research-finding/v1/README.md research-contracts/research-finding/v1/schema.json research-contracts/research-finding/v1/wbc1.fixture.json
          git diff --cached --check
          git commit -m "fix: make model promotion disclaimer outcome-neutral"
          git push origin HEAD:fix/issue320-model-promotion-20260917
