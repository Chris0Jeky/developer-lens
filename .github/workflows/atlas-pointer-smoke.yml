name: Atlas native pointer evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scripts/atlasPointer*'
      - scripts/exportDemo.ts
      - package.json
      - package-lock.json
      - 'vite.config.*'
      - .github/workflows/atlas-pointer-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pointer:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the verified invented showcase
        run: npm run build:showcase
      - name: Trace native pointer sequences against the local C0 build
        shell: bash
        run: |
          git rev-parse HEAD
          export CHROME_PATH="$(command -v google-chrome)"
          "$CHROME_PATH" --version
          node scripts/atlasPointerSmoke.mjs dist
