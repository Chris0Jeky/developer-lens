name: Materialize pinned review doc blobs
on:
  push:
    branches: [maintenance/review-repair-receipts-20260922]
    paths: [.github/workflows/review-doc-blobs-20260922.yml]
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == 'Chris0Jeky/developer-lens' && github.ref == 'refs/heads/maintenance/review-repair-receipts-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate exact inputs and create immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const repo = 'Chris0Jeky/developer-lens';
          const hash = (text) => {
            const bytes = Buffer.from(text, 'utf8');
            return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          };
          function transform(text, edits) {
            for (const [before, after] of edits) {
              assert.ok(before.length > 0);
              assert.equal(text.split(before).length - 1, 1, 'Expected exactly one replacement anchor');
              text = text.replace(before, () => after);
            }
            return text;
          }
          assert.equal(transform('one two', [['two', 'three']]), 'one three');
          assert.equal(transform('one two', [['two', '$&']]), 'one $&');
          assert.throws(() => transform('one', [['missing', 'two']]));
          assert.throws(() => transform('one one', [['one', 'two']]));
          assert.throws(() => transform('one', [['', 'two']]));
          assert.equal(hash(''), 'e69de29bb2d1d6434b8b29ae775ad8c2e48c5391');
          async function api(resource, body) {
            assert.ok(resource.startsWith('contents/') || resource === 'git/blobs');
            assert.ok(body === undefined || resource === 'git/blobs');
            const response = await fetch(`https://api.github.com/repos/${repo}/${resource}`, {
              method: body === undefined ? 'GET' : 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            });
            if (!response.ok) throw new Error(`GitHub request failed: ${response.status}`);
            return response.json();
          }
          const ladderEdits = [
            ['Rungs 1 and 2 stay executable: score structured retrieval, then model-free BM25 only when either recall target fails. Rung 3 vectors stays PARKED as not_evaluated under D12=NO; only a newer owner decision may supersede it. Every candidate still needs reviewed activation and proof.', 'Score structured rung 1; evaluate model-free BM25 only if either recall target fails. Vectors remain not_evaluated under D12=NO; every candidate still needs separately reviewed activation and proof.'],
            ['ADR-20; rung 2 uses DL-RAG-02, must beat rung 1, and must pass prohibited-field and uniqueness-leakage canaries. Parked rung 3 is not_evaluated, not rejected.', 'ADR-20; evaluated BM25 must beat rung 1, pass prohibited-field and uniqueness-leakage canaries plus membership-inference ROC-AUC <= 0.55, and run the real-index deletion and stale-index procedures in RAG design section 5.2.'],
            ['Record rung 1. Evaluate rung 2 only when Recall@k OR counter-evidence recall fails; if evaluated, both privacy canaries pass. Rung 3 = not_evaluated (D12=NO), never experimental rejection.', 'Rung 2 runs only if Recall@k OR counter-evidence recall misses its target. Prove worker termination, rebuild-empty, artifact deletion and stale-index fallback on BM25; result fixtures are not lifecycle proof. Rung 3 = not_evaluated (D12=NO).'],
            ['Frozen candidate-independent invented retrieval benchmark harness: Recall@k, nDCG/MRR, citation validity, counter-evidence recall, unsupported-claim rate, deletion proof, stale-index behaviour, and privacy probes. It proves rung 1 and exposes a stable scoring seam for downstream model-free BM25 without importing that candidate. Vectors remain outside scope under D12=NO.', 'Candidate-independent invented harness for rung-1 retrieval quality and privacy metrics, plus frozen scoring/procedure interfaces for later BM25. No candidate is imported. Index-only lifecycle and membership proofs remain not_evaluated until DL-WB-C9 runs them on BM25; vectors stay outside scope under D12=NO.'],
            ['ADR-20 candidate-independent battery; deletion proof = index rebuilt-empty after simulated revocation. Candidate results enter through the frozen format; the harness never imports BM25.', 'Run baseline-applicable metrics and canaries on structured retrieval. Invented candidate results test only the interface/scorer; they do not prove index deletion, worker termination, rebuilding or stale-index fallback.'],
            ['All metrics compute; rung 1 and its canaries are green; an invented candidate-result fixture scores without a BM25 dependency; suite versioned+checksummed.', 'Rung-1 metrics/canaries and harness/interface tests pass; index-only procedures are explicitly not_evaluated, not passed. Freeze/checksum the suite; DL-WB-C9 must execute those procedures on BM25.'],
          ];
          const plans = [
            {
              pr: 346,
              ref: 'f667969006cba1f17d59e9b69baf5e20835c23f0',
              path: 'docs/analyser-program/02_FEATURE_EVIDENCE_CATALOG.md',
              inputSha: '693193fa1ef5c8d41880743e19fb10d123b6db92',
              outputSha: 'ff1e2a05cca4c5b700ee3a08bb480b524cbaad46',
              edits: [
                ['  `DL.XRAY.ROLE_PRESENCE.v1` (P) — presence boolean + file count per role;', '  `DL.XRAY.ROLE_PRESENCE.v1` (P) — presence boolean + file count for the fourteen ordinary\n  roles; `agent_config` is the D5=PRES exception: one per-repository presence boolean only,\n  with no file count, cardinality, names, or configuration-body reads;'],
                ['  deterministic (derived), never observed** — language shares, role counts, and boundary counts are\n  products of enumeration plus the closed classification tables and carry `parser_coverage`', '  deterministic (derived), never observed** — language shares, ordinary-role counts, the\n  presence-only `agent_config` boolean, and boundary counts are products of enumeration plus the\n  closed classification tables. Agent-configuration cardinality is neither retained nor emitted;\n  the presence-only exception also applies to every baseline and comparison, not merely the UI.\n  These outputs carry `parser_coverage`'],
                ['  sink under the adversarial canary scan; **zero manifest-body reads with only', '  sink under the adversarial canary scan; invented trees with one or several agent-configuration\n  files expose the same `agent_config: true` boolean and no configuration cardinality;\n  **zero manifest-body reads with only'],
              ],
            },
            { pr: 347, ref: '5c344bb4bcd40f3eb353907d9b160923b8c7bc5c', path: 'docs/analyser-program/taskdeck/tools/cards.mjs', inputSha: '5e0bbe8e021c0a9c02d864c2f4f7e13ee8bdb914', outputSha: '322bf79046f4acc31f618b0c15d1b1ad7deb980d', edits: ladderEdits },
            { pr: 347, ref: '5c344bb4bcd40f3eb353907d9b160923b8c7bc5c', path: 'docs/analyser-program/taskdeck/developer-lens-intelligence-platform.taskdeck.json', inputSha: 'df3965f5d6c51978374c5e430ca97ca5a5de1d4f', outputSha: 'f33e0db5d0b37c2add94ccb27a4b3fc48940a763', edits: ladderEdits },
            {
              pr: 349,
              ref: '9d25d649f70d8f1eafa4d1db4ebb48b7bbd79264',
              path: 'docs/analyser-program/04_LOCAL_RAG_DESIGN.md',
              inputSha: '059f23d53ec4e0973dc006d04b468e88c03325ce',
              edits: [
                ['Eligible set  (above the working ceiling: deterministic total-order prefix + truncation limitation)', 'Eligible set  (above the working ceiling: mandatory-role reservoirs, then global total-order fill + truncation limitation)'],
                ['- Limitation codes: `RAG_QUOTA_SHORTFALL_CONTRADICTING`, `RAG_QUOTA_SHORTFALL_COVERAGE`,', '- Limitation codes: `RAG_QUOTA_SHORTFALL_SUPPORTING`, `RAG_QUOTA_SHORTFALL_CONTRADICTING`,\n  `RAG_QUOTA_SHORTFALL_COVERAGE`,'],
                ['  the deterministic total-order prefix is an acceptable degradation because it is *recorded*.\n  *Reason:* a recorded, reproducible truncation is auditable; an unordered one is not.', '  the two-stage role-aware admission in section 1 is an acceptable degradation because it\n  preserves mandatory-role reservoirs before global total-order filling and is *recorded*.\n  *Reason:* deterministic reservoirs prevent cross-role starvation; total and per-role\n  eligible/admitted counts make the remaining recall loss auditable. A flat prefix is not allowed.'],
              ],
            },
          ];
          const prepared = [];
          // Validate every pinned input and every edit before the first write. No checkout or code from a target branch is executed.
          for (const plan of plans) {
            const file = await api(`contents/${plan.path}?ref=${plan.ref}`);
            assert.equal(file.encoding, 'base64');
            assert.equal(file.sha, plan.inputSha);
            const source = Buffer.from(file.content, 'base64').toString('utf8');
            assert.equal(hash(source), plan.inputSha);
            const content = transform(source, plan.edits);
            const outputSha = hash(content);
            if (plan.outputSha) assert.equal(outputSha, plan.outputSha);
            if (plan.path.endsWith('.json')) {
              const cards = JSON.parse(content).seedCards;
              assert.equal(cards.length, 128);
              assert.ok(cards.every((card) => card.description.length <= 2000));
            }
            prepared.push({ plan, content, outputSha });
          }
          for (const { plan, content, outputSha } of prepared) {
            const result = await api('git/blobs', { content, encoding: 'utf-8' });
            assert.equal(result.sha, outputSha);
            console.log(JSON.stringify({ pr: plan.pr, ref: plan.ref, path: plan.path, inputSha: plan.inputSha, outputSha }));
          }
          console.log('No tree, commit, branch, pull request, or merge was written by this job.');
          NODE
