name: Materialize pinned review doc blobs
on:
  push:
    branches: [maintenance/review-repair-receipts-20260922]
    paths: [.github/workflows/review-doc-blobs-20260922.yml]
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == 'Chris0Jeky/developer-lens' && github.ref == 'refs/heads/maintenance/review-repair-receipts-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate pinned inputs and materialize immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const repo = 'Chris0Jeky/developer-lens';
          function hash(text) {
            const bytes = Buffer.from(text, 'utf8');
            return createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          }
          function transform(text, edits) {
            for (const [before, after] of edits) {
              assert.ok(before.length > 0);
              assert.equal(text.split(before).length - 1, 1, 'Expected one exact anchor');
              text = text.replace(before, () => after);
            }
            return text;
          }
          assert.equal(transform('one two', [['two', '$&']]), 'one $&');
          assert.throws(() => transform('one', [['missing', 'two']]));
          assert.throws(() => transform('one one', [['one', 'two']]));
          assert.throws(() => transform('one', [['', 'two']]));
          assert.equal(hash(''), 'e69de29bb2d1d6434b8b29ae775ad8c2e48c5391');
          async function api(resource, body) {
            assert.ok(resource.startsWith('contents/') || resource === 'git/blobs');
            assert.ok(body === undefined || resource === 'git/blobs');
            const response = await fetch(`https://api.github.com/repos/${repo}/${resource}`, {
              method: body === undefined ? 'GET' : 'POST', redirect: 'error', signal: AbortSignal.timeout(30000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            });
            if (!response.ok) throw new Error(`GitHub request failed: ${response.status}`);
            return response.json();
          }
          const plans = [
            {
              pr: 346, ref: '8baf86f14cbb73ab0ba10b36fbad089e545b9eee',
              path: 'docs/analyser-program/02_FEATURE_EVIDENCE_CATALOG.md',
              inputSha: 'ff1e2a05cca4c5b700ee3a08bb480b524cbaad46',
              edits: [
                ['roles; `agent_config` is the D5=PRES exception: one per-repository presence boolean only,\n  with no file count, cardinality, names, or configuration-body reads;', 'roles; `agent_config` is the D5=PRES exception: one point-in-time, per-repository presence\n  boolean only, displayed as a separate non-comparative annotation, with no file count,\n  cardinality, names, or configuration-body reads;'],
                ['the presence-only exception also applies to every baseline and comparison, not merely the UI.', '`agent_config` is excluded from every baseline/comparison aggregate, historical series,\n  temporal delta, and portfolio comparison, not merely hidden in their UI. It cannot enter\n  CAT-STR-03 or `DL.TIME.ERA_DIFF.v1`; adoption inference and timing remain blocked by\n  `DL-Q-AGENTCFG-TIMING`. Only the current per-repository annotation is authorized by D5=PRES.'],
                ['**Architecture Time Machine** (composition strip). Corpus: monorepo with three packages;', '**Architecture Time Machine** (ordinary-role composition strip only; never `agent_config`).\n  The agent-configuration annotation is point-in-time and per-repository in Evidence Atlas only.\n  Corpus: monorepo with three packages;'],
                ['files expose the same `agent_config: true` boolean and no configuration cardinality;', 'files expose the same `agent_config: true` boolean and no configuration cardinality;\n  snapshots that differ only in agent-configuration presence produce identical temporal and\n  portfolio aggregates, with neither presence values nor change markers admitted to those outputs;'],
                ['- **Sources / fields** — Composed, not collected: CAT-STR-01 composition, CAT-STR-02 graph and API', '- **Sources / fields** — Composed, not collected: CAT-STR-01 ordinary composition aggregates\n  (**excluding `agent_config` entirely under D5=PRES / `DL-Q-AGENTCFG-TIMING`**), CAT-STR-02 graph and API'],
              ],
            },
            {
              pr: 349, ref: '04274132c6acfab89adfe608a36ae423489cdee8',
              path: 'docs/analyser-program/04_LOCAL_RAG_DESIGN.md',
              inputSha: '550568b5de54f1c2fc3b4ed5dcb2b6ca3c142a45',
              edits: [
                ['the admitted prefix. Making cross-build replay reproducible therefore requires the pack contract', 'the admitted working set. Making cross-build replay reproducible therefore requires the pack contract'],
                ['result set (same-build scope, per step 1). That conclusion now *follows from* the stated procedure — whole eligible set ranked\n   (or a deterministic prefix of a total order taken), no unordered `LIMIT` anywhere, no non-finite\n   scalars, cap applied after ranking — instead of being asserted beside it.', 'result set (same-build scope, per step 1). That conclusion *follows from* the procedure: rank\n   the whole eligible set unless the working ceiling binds; then first admit mandatory-role\n   reservoirs and fill remaining capacity by the global total order from step 1, and rank that\n   admitted working set. No unordered `LIMIT`, no flat-prefix working-set cap, and no non-finite\n   scalars are allowed; apply the final candidate cap only after ranking.'],
              ],
            },
            {
              pr: 353, ref: '83a4943929f3b915d72941bc056710b6fc84ab49',
              path: 'shared/whyContract.ts', inputSha: '116d3c1cd9c9d5b83e0cd1054ed96b7a71075fd9',
              edits: [
                [": tree.scope.targetKind === 'scope'\n      ? tree.scope.targetId", ": tree.scope.targetKind === 'scope' && tree.scope.reason === 'MISSING_SCOPE'\n      ? tree.scope.targetId"],
                ["}) satisfies z.ZodType<WhyUnresolvable>", "  for (const [index, event] of projection.lineage.entries()) {\n    if (projection.claimId === null || event.subjectId !== projection.claimId) {\n      context.addIssue({\n        code: 'custom',\n        path: ['lineage', index, 'subjectId'],\n        message: 'unresolvable lineage event does not name its claim',\n      })\n    }\n  }\n}) satisfies z.ZodType<WhyUnresolvable>"],
              ],
            },
            {
              pr: 361, ref: '8c8f732ecf5a286c8785dd186c46ef308bcf9736',
              path: 'docs/agent-system/FRICTION_LOG.md', inputSha: 'dfc9eee62c8b92b2ed8dd480fbe1fd8088210107',
              edits: [
                ['- **occurrences:** 9 recorded — 2026-08-09 (the P0.5 pre-QA reconciliation worktree)', '- **occurrences:** 10 recorded — 2026-08-09 (the P0.5 pre-QA reconciliation worktree)'],
                ['### FR-013 — full product gate exceeded a compound shell timeout', '  **2026-09-22 recurrence note:** The #361 ZIP-based worktree exactly matched initial main,\n  but lacked installed dependencies and the required Node 24 runtime. A single npm runtime\n  bootstrap attempt failed with registry DNS resolution unavailable. No foreign-tool or local\n  full-suite result was accepted; native GitHub exact-head Node 24 jobs supplied canonical proof.\n  Dependency-free local probes and generated-manifest checks remained usable. This is the tenth\n  occurrence of the same bootstrap boundary; the existing enforcement remains appropriate.\n\n### FR-013 — full product gate exceeded a compound shell timeout'],
                ['- **occurrences:** 2 independent occurrences — 2026-08-15 exact-head review hop and the guessed\n  absent taskdeck/README.md target.', '- **occurrences:** 3 independent occurrences — 2026-08-15 exact-head review hop, the guessed\n  absent taskdeck/README.md target, and the 2026-09-22 #361 guessed resolver filename.'],
                ['### FR-058 — continuation-skill discovery assumed an absent path', '  **2026-09-22 recurrence note:** A guessed resolver filename was absent during #353 review.\n  Scoped filename discovery located the existing whyResolver.ts; only that source was read.\n  The existing #222 checked-path task remains the enforcement point.\n\n### FR-058 — continuation-skill discovery assumed an absent path'],
                ['- **occurrences:** 1 independent occurrence, recorded by [Product issue #222 comment 5303418489](https://github.com/Chris0Jeky/developer-lens/issues/222#issuecomment-5303418489).', '- **occurrences:** 2 independent occurrences: [Product issue #222 comment 5303418489](https://github.com/Chris0Jeky/developer-lens/issues/222#issuecomment-5303418489) and the 2026-09-22 #361 manifest-key assumption.'],
                ['- **promotion:** One helper result-shape occurrence. Keep distinct from FR-052 count integrity and\n  FR-071\'s positional-argument input interface; do not promote until an independent recurrence.', '- **promotion:** The second independent occurrence proposes checked top-level shape assertions\n  in #222 helper contracts before indexing returned objects. This is a proposed enforcement task,\n  not an implemented shared helper. Keep distinct from FR-052 count integrity and FR-071.'],
                ['### FR-073 — `rg test*` was parsed as an invalid Windows positional path', '  **2026-09-22 recurrence note:** A local manifest check assumed `cards` instead of the actual\n  `seedCards` field and stopped with KeyError before publication. Reading the generator contract\n  corrected the check; the resulting 128-card manifest matched its source and published blob hash.\n  #361 records the occurrence; #222 retains the proposed shape-assertion follow-up.\n\n### FR-073 — `rg test*` was parsed as an invalid Windows positional path'],
              ],
              append: '\n\n### FR-099 - connector endpoint support is narrower than repository access\n\n- **first-seen:** 2026-09-22\n- **status:** `workaround-documented`\n- **symptom:** The connected GitHub app could read/write the repository and PRs, but the branch-protection read returned integration 403 and a nested check-annotation fetch returned unsupported-endpoint 400.\n- **impact:** Those endpoints could not establish protection configuration or test failure details.\n- **workaround:** No protection was changed or waived. Use the declared required job and its exact-head status, and the native workflow-job-log action for failure details; do not retry equivalent generic network routes.\n- **occurrences:** 1 bounded connector capability audit in [#361](https://github.com/Chris0Jeky/developer-lens/pull/361).\n- **task:** #361 maintenance handoff records the native read/CI/write route and the uninspected settings boundary.\n- **promotion:** One occurrence remains documentation debt; do not request broader permissions merely to bypass a read limitation.\n\n### FR-100 - interactive container execution unavailable\n\n- **first-seen:** 2026-09-22\n- **status:** `workaround-documented`\n- **symptom:** A requested interactive execution session returned StreamingExecNotEnabledContainerError.\n- **impact:** The local bootstrap command could not use that execution mode.\n- **workaround:** Use ordinary bounded synchronous container executions and preserve their exit codes.\n- **occurrences:** 1 occurrence in [#361](https://github.com/Chris0Jeky/developer-lens/pull/361).\n- **task:** #361 continuation instructions retain the supported execution mode.\n- **promotion:** One environment-specific occurrence warrants no repository runtime change.\n',
            },
          ];
          const prepared = [];
          for (const plan of plans) {
            const file = await api(`contents/${plan.path}?ref=${plan.ref}`);
            assert.equal(file.encoding, 'base64');
            assert.equal(file.sha, plan.inputSha);
            const source = Buffer.from(file.content, 'base64').toString('utf8');
            assert.equal(hash(source), plan.inputSha);
            const content = transform(source, plan.edits) + (plan.append ?? '');
            if (plan.pr === 349) {
              assert.ok(!content.includes('a deterministic prefix of a total order taken'));
              assert.ok(!content.includes('the admitted prefix'));
            }
            prepared.push({ plan, content });
          }
          for (const { plan, content } of prepared) {
            const outputSha = hash(content);
            const result = await api('git/blobs', { content, encoding: 'utf-8' });
            assert.equal(result.sha, outputSha);
            console.log(JSON.stringify({ pr: plan.pr, ref: plan.ref, path: plan.path, inputSha: plan.inputSha, outputSha }));
          }
          console.log('Immutable blobs only: no checkout, execution of target code, tree, commit, ref, PR or merge writes.');
          NODE
