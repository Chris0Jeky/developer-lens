name: Verify issue 217 clean client chunk budget

on:
  push:
    branches:
      - fix/issue217-client-chunk-budget-20260917

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue217-client-chunk-budget-20260917
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove lint and focused build budgets
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/issue217-lint.log
          if grep -Eq 'Found [1-9][0-9]* warnings' /tmp/issue217-lint.log; then
            echo "The client chunk configuration introduced lint warnings"
            exit 1
          fi
          npx vite build 2>&1 | tee /tmp/issue217-build.log
          if grep -q "Some chunks are larger than 500 kB" /tmp/issue217-build.log; then
            echo "Vite still reported an oversized chunk"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          chunks = sorted((path.stat().st_size, path.name) for path in Path('dist/assets').glob('*.js'))
          if not chunks:
              raise SystemExit('build emitted no JavaScript chunks')
          largest_bytes, largest_name = chunks[-1]
          print(f'largest fixed chunk: {largest_name} ({largest_bytes} bytes)')
          if largest_bytes > 500_000:
              raise SystemExit(f'client chunk budget exceeded: {largest_name} ({largest_bytes} bytes)')
          PY

      - name: Prove the full repository and showcase
        run: |
          npm run check
          npm run build:showcase
          npm run verify:context
          git checkout -- public/social-card.png
          git diff --check

      - name: Assert bounded final diff
        shell: python
        run: |
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'main...HEAD'], text=True).splitlines())
          expected = {'vite.config.ts'}
          if changed != expected:
              raise SystemExit(f'unexpected final files: {sorted(changed)}')

      - name: Remove verification workflow
        run: |
          git rm .github/workflows/agent-issue217-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove issue 217 verification workflow"
          git push origin HEAD:fix/issue217-client-chunk-budget-20260917
