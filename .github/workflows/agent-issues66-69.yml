name: Apply RAG role-quota design fixes

on:
  push:
    branches:
      - docs/issues66-69-rag-role-quotas-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/issues66-69-rag-role-quotas-20260917
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply the bounded reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/analyser-program/04_LOCAL_RAG_DESIGN.md')
          text = path.read_text(encoding='utf-8')
          old = '  shrinking a bundle to fit removes supporting evidence before counter-evidence. **R**'
          new = 'shrinking a bundle to fit removes supporting evidence before counter-evidence. **R**'
          if text.count(old) != 1:
              raise SystemExit(f'G4 indentation precondition: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python .github/agent/issue66_69.py

      - name: Install dependencies
        run: npm ci

      - name: Prove documentation and repository consistency
        run: |
          npm run verify:context
          node docs/analyser-program/taskdeck/tools/generate.mjs --check
          npm run check
          git diff --check

      - name: Assert bounded diff
        shell: python
        run: |
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'docs/analyser-program/04_LOCAL_RAG_DESIGN.md'}
          if changed != expected:
              raise SystemExit(f'unexpected changed files: {sorted(changed)}')

      - name: Commit verified design reconciliation
        run: |
          git rm .github/workflows/agent-issues66-69.yml .github/agent/issue66_69.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/analyser-program/04_LOCAL_RAG_DESIGN.md
          git diff --cached --check
          git commit -m "docs: make RAG truncation role-aware"
          git push origin HEAD:docs/issues66-69-rag-role-quotas-20260917
